[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ledgertimer"
version = "1.0"
description = "A lightweight, privacy-first desktop time tracker for freelancers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
]

[project.scripts]
ledgertimer = "ledgertimer.__main__:main"

[project.urls]
Homepage = "https://github.com/vincent7q/LedgerTimer"
Issues = "https://github.com/vincent7q/LedgerTimer/issues"

[tool.setuptools.packages.find]
include = ["ledgertimer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
